  <div id="app" class="app"><noscript>Para usar la checklist y el calendario necesitas activar JavaScript. Las recomendaciones generales están disponibles en las fuentes oficiales: ACOG y NHS.</noscript></div>
<script>
(()=>{
  'use strict';
  const STORAGE='volver-a-ti-v1';
  const S={home:'home',plan:'plan',library:'library',care:'care'};
  const icons={
    home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-8h6v8"/>',
    plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 15h3"/>',
    library:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',
    care:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.2 8.2a1 1 0 0 0 1.4 0l8.1-8.2a5.5 5.5 0 0 0 0-7.8Z"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    sparkle:'<path d="m12 3 1.7 6.3L20 11l-6.3 1.7L12 19l-1.7-6.3L4 11l6.3-1.7z"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>'
  };
  const svgIcon=(key)=>`<svg class="icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">${icons[key]||icons.info}</svg>`;
  function dayISO(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}
  function parseLocal(x){const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d,12,0,0);}
  const now=()=>new Date();
  function startingDate(){const d=now();d.setDate(d.getDate()-4);return dayISO(d);}
  function readState(){try{const raw=JSON.parse(localStorage.getItem(STORAGE));return raw&&typeof raw==='object'?raw:{};}catch{return {};}}
  const state=readState();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(state.birthDate||''))state.birthDate=startingDate();
  state.checked=state.checked&&typeof state.checked==='object'?state.checked:{};
  state.page='home';state.selectedWeek=null;state.filter='available';state.modal=null;
  const weeks=[
    {name:'Descansar y reconectar',focus:'El cuerpo acaba de dar a luz. Todo movimiento es opcional y debe resultar cómodo.',walk:'Paseos dentro de casa, 3–5 minutos si apetece; también vale levantarse y moverse con suavidad.',exercise:'Respiración tranquila y suelo pélvico suave. Descansar forma parte del plan.',key:'No aumentar si hay dolor, cansancio intenso o más sangrado.',ids:['breath','pelvic','walk']},
    {name:'Movilidad amable',focus:'Continuar con los movimientos que sientan bien, sin buscar intensidad.',walk:'Paseos de 5–10 minutos, seguidos o repartidos, únicamente si se toleran.',exercise:'Respiración y suelo pélvico; introducir basculaciones pélvicas (5–8 repeticiones).',key:'Mantener el esfuerzo bajo: poder hablar con normalidad.',ids:['breath','pelvic','walk','tilt']},
    {name:'Volver a moverse',focus:'Recuperar confianza con movimientos cotidianos.',walk:'10–15 minutos al día, si está cómoda; pueden ser varios paseos.',exercise:'Añadir levantarse de una silla 1 serie de 5–8 repeticiones, 2 días por semana.',key:'No empujar ni contener la respiración al levantarse.',ids:['pelvic','walk','tilt','sit']},
    {name:'Estabilidad tranquila',focus:'Empezar a trabajar las piernas muy ligeramente.',walk:'Hasta 15–20 minutos al día, a ritmo fácil.',exercise:'Sentarse/levantarse y elevación de talones: 1 serie de 8–10 repeticiones, 2 días por semana.',key:'Si nota pesadez vaginal, escapes o dolor, parar y consultar.',ids:['pelvic','walk','tilt','sit','heels']},
    {name:'Fuerza con suavidad',focus:'Introducir un movimiento sencillo para glúteos y zona media.',walk:'Hasta 20–25 minutos cómodos al día.',exercise:'Añadir puentes de glúteos suaves: 1 serie de 8 repeticiones, 2 días por semana.',key:'Mantener el abdomen sin abombarse o formar un cono al hacer fuerza.',ids:['pelvic','walk','sit','heels','bridge']},
    {name:'Consolidar la base',focus:'Repetir antes de aumentar: la regularidad importa más que la intensidad.',walk:'20–30 minutos suaves si los tolera.',exercise:'Hasta 2 series de los ejercicios anteriores, dos días por semana, si no hay síntomas.',key:'Programar la revisión posparto habitual (aprox. semanas 6–8).',ids:['pelvic','walk','sit','heels','bridge']},
    {name:'Revisión y progresión',focus:'Si la revisión es satisfactoria, introducir algo de resistencia.',walk:'25–30 minutos a ritmo cómodo.',exercise:'Añadir remo con banda elástica ligera: 1–2 series de 8 repeticiones, 2 días por semana.',key:'La progresión de fuerza requiere buena recuperación y ausencia de síntomas.',ids:['pelvic','walk','sit','heels','bridge','band']},
    {name:'Más confianza',focus:'Mantener actividades de bajo impacto y ganar tolerancia.',walk:'Alrededor de 30 minutos, ajustados a su energía.',exercise:'Fuerza ligera 2–3 días por semana; priorizar técnica y respiración.',key:'Si un día está agotada, reducir o saltarse la sesión.',ids:['pelvic','walk','sit','heels','bridge','band']},
    {name:'Construir resistencia',focus:'Hacer un poquito más, pero sin prisa.',walk:'30–35 minutos si resulta cómodo; dividirlos cuando convenga.',exercise:'Aumentar 1–2 repeticiones o un poco la tensión de la banda, no ambas a la vez.',key:'No entrenar con dolor, pérdidas de orina o sensación de peso.',ids:['pelvic','walk','sit','heels','bridge','band']},
    {name:'Movimiento cotidiano',focus:'Sentirse cada vez más fuerte para la actividad diaria.',walk:'30–40 minutos en total si está cómoda.',exercise:'Hasta 3 sesiones semanales de fuerza ligera con descansos entre ellas.',key:'Seguir evitando esfuerzos intensos si todavía hay síntomas.',ids:['pelvic','walk','sit','heels','bridge','band']},
    {name:'Consolidar hábitos',focus:'Buscar una rutina sostenible con un bebé en casa.',walk:'30–40 minutos ajustados al descanso y la energía.',exercise:'Incrementar ligeramente series o resistencia solo si la recuperación lo permite.',key:'Se puede repetir esta semana las veces que haga falta.',ids:['pelvic','walk','sit','heels','bridge','band']},
    {name:'Siguiente capítulo',focus:'La recuperación no se acaba en la semana 12.',walk:'Paseos agradables de hasta 30–45 minutos si lo tolera.',exercise:'Seguir con fuerza ligera y valorar con un profesional la vuelta a correr o saltar.',key:'El impacto no es una obligación ni debe retomarse automáticamente a las 12 semanas.',ids:['pelvic','walk','sit','heels','bridge','band']}
  ];
  const exercises=[
    {id:'breath',name:'Respiración suave',week:1,dose:'5–8 respiraciones',subtitle:'Soltar tensión y recuperar la conexión con el abdomen.',steps:['Túmbate o siéntate con apoyo en una posición cómoda.','Inspira lentamente y deja que las costillas se expandan.','Espira sin empujar ni aguantar el aire. Repite sin forzar.'],note:'Si al tumbarte te mareas o estás incómoda, hazlo sentada.',tint:'green'},
    {id:'pelvic',name:'Suelo pélvico',week:1,dose:'3–5 contracciones suaves',subtitle:'Activación gentil, siempre con relajación completa.',steps:['Imagina que intentas evitar que se escape un gas, cerrando y elevando suavemente la zona.','Mantén 1–3 segundos si puedes, respirando normalmente.','Suelta y descansa más tiempo del que contrajiste. Con las semanas podrás aumentar la duración y repeticiones.'],note:'No practicar cortando el chorro de orina; si hay dolor o dificultad para relajar, consulta.',tint:'peach'},
    {id:'walk',name:'Paseo tranquilo',week:1,dose:'Desde 3–5 minutos',subtitle:'Movimiento ligero para recuperar la movilidad.',steps:['Empieza caminando por casa o en terreno llano.','Mantén un ritmo que te permita conversar.','Para antes de agotarte y adapta el tiempo a las sensaciones del día.'],note:'Si aumenta el sangrado o aparece pesadez vaginal, reduce la actividad y consulta.',tint:'blue'},
    {id:'tilt',name:'Basculación pélvica',week:2,dose:'5–8 repeticiones',subtitle:'Movilidad delicada de pelvis y espalda.',steps:['Túmbate boca arriba con las rodillas flexionadas.','Al espirar, gira la pelvis ligeramente para acercar la espalda baja al suelo.','Relaja y vuelve lentamente a la posición neutra.'],note:'Movimiento pequeño, sin dolor y sin levantar las caderas.',tint:'green'},
    {id:'sit',name:'Sentarse y levantarse',week:3,dose:'1 × 5–8 repeticiones',subtitle:'Recuperar fuerza útil para el día a día.',steps:['Siéntate en una silla estable con los pies bien apoyados.','Al espirar, levántate lentamente, con ayuda de las manos si la necesitas.','Vuelve a sentarte de manera controlada.'],note:'Comienza dos días por semana; sin esfuerzo intenso.',tint:'peach'},
    {id:'heels',name:'Elevación de talones',week:4,dose:'1 × 10 repeticiones',subtitle:'Activación suave de las pantorrillas y el equilibrio.',steps:['Colócate de pie junto a una silla o superficie estable.','Elévate lentamente sobre las puntas de los pies.','Baja de nuevo con control y sin perder el equilibrio.'],note:'Puedes sujetarte durante todo el ejercicio.',tint:'blue'},
    {id:'bridge',name:'Puente de glúteos',week:5,dose:'1 × 8 repeticiones',subtitle:'Fortalecer glúteos y mejorar control pélvico.',steps:['Túmbate boca arriba, rodillas dobladas y pies apoyados.','Al espirar, eleva las caderas un poco sin arquear la espalda.','Desciende lentamente. Detente si el abdomen se abomba.'],note:'Hazlo solo si los movimientos previos son cómodos y no hay síntomas.',tint:'green'},
    {id:'band',name:'Remo con banda',week:7,dose:'1–2 × 8 repeticiones',subtitle:'Fuerza ligera para espalda y postura.',steps:['Sentada o de pie, sujeta una banda elástica suave, fijada con seguridad.','Al espirar, tira de los codos hacia atrás sin encoger los hombros.','Vuelve lentamente a la posición inicial.'],note:'Introducir tras revisión posparto satisfactoria y si no hay dolor ni síntomas pélvicos.',tint:'peach'}
  ];
  const labels={home:'Hoy',plan:'Mi plan',library:'Ejercicios',care:'Cuidados'};
  function diffDay(){return Math.max(1,Math.round((parseLocal(dayISO(now()))-parseLocal(state.birthDate))/86400000)+1);}
  function currentWeek(){return Math.min(12,Math.max(1,Math.ceil(diffDay()/7)));}
  function prettyDate(iso){return parseLocal(iso).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});}
  function currentDisplayDate(){return now().toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function save(){try{localStorage.setItem(STORAGE,JSON.stringify({birthDate:state.birthDate,checked:state.checked}));}catch(e){console.warn('No se pudo guardar en el dispositivo',e);}}
  function tasks(w){
    let all=[{id:'rest',title:'Una pausa para descansar',detail:'Descansar también cuenta como cuidarte.'},{id:'pelvic',title:'Activación suave del suelo pélvico',detail:w<=2?'3–5 contracciones suaves, 2 veces al día, si resulta cómodo.':'Contracciones cómodas y relajación completa, sin dolor.'},{id:'walk',title:'Caminar un poquito',detail:w===1?'Unos minutos por casa, solo si apetece.':weeks[w-1].walk}];
    if(w<=2)all.splice(1,0,{id:'breath',title:'Respirar sin prisas',detail:'5–8 respiraciones tranquilas, una o dos veces.'});
    if(w===2)all.push({id:'tilt',title:'Mover la pelvis suavemente',detail:'5–8 basculaciones, si te encuentras bien.'});
    if(w>=3){const dow=now().getDay();const strengthDays=w<10?[2,5]:[1,3,6];if(strengthDays.includes(dow))all.push({id:'strength',title:'Un poco de fuerza ligera',detail:`${w<7?'Una serie suave':'1–2 series suaves'} · Ver la rutina de la semana ${w}.`});}
    return all;
  }
  function checkedToday(){return state.checked[dayISO(now())]||[];}
  function heroArt(){return `<svg viewBox="0 0 240 240" aria-hidden="true"><path d="M132 53c-30 1-46 29-47 56-1 13 2 26 7 40" fill="none" stroke="#4b8069" stroke-width="5" stroke-linecap="round"/><path d="M153 73c21 17 32 43 30 71-3 38-31 62-62 62-34 0-59-25-61-56-2-26 9-49 29-59" fill="#b4d0bb" opacity=".95"/><path d="M98 96c-16 7-27 21-31 39 15-8 28-9 42-5 16 5 24 18 30 29 14-18 30-23 47-20-4-24-19-44-40-50" fill="#cfe1d2"/><ellipse cx="136" cy="64" rx="25" ry="27" fill="#ecd0b9"/><path d="M113 56c-3-28 42-36 49-7 1 8-2 14-7 18-3-16-9-18-17-19-9 11-17 12-25 8Z" fill="#3e6c57"/><path d="M108 95c-15 12-25 28-31 49-6 23-3 46 10 61" fill="none" stroke="#3e735c" stroke-width="19" stroke-linecap="round"/><path d="M166 100c10 12 16 27 18 42" fill="none" stroke="#3e735c" stroke-width="17" stroke-linecap="round"/><path d="M113 147c10-20 32-28 49-19 17 9 23 30 11 46-11 16-33 17-49 6" fill="#eac9ab"/><ellipse cx="147" cy="140" rx="16" ry="14" fill="#f1d8c5"/><path d="M135 137c8-10 20-11 26-5" stroke="#ad856b" stroke-width="2" fill="none"/><path d="M101 153c17 19 43 27 62 19" fill="none" stroke="#3e735c" stroke-width="13" stroke-linecap="round"/><path d="M88 207c22 15 68 18 98-1" stroke="#a6c7af" stroke-width="2" fill="none"/></svg>`;}

    const common=`<path d="M38 105h204" stroke="#adc8b6" stroke-width="2" opacity=".7"/>`;
    let shapes='';

    else if(id==='pelvic'){shapes=`<path d="M87 47c-17 17-29 45-15 69 10 18 31 24 46 27 15-5 27-18 32-32 5 14 17 27 32 32 15-3 36-9 46-27 14-24 2-52-15-69" fill="none" stroke="#c89782" stroke-width="8" stroke-linecap="round"/><path d="M98 97Q150 151 202 97Q196 149 150 162Q104 149 98 97Z" fill="#dfafa2"/><path d="M150 146V83m0 0-10 11m10-11 10 11" stroke="#985e5b" stroke-width="3" fill="none" stroke-linecap="round"/>`}
    else if(id==='walk'){shapes=`<circle cx="143" cy="35" r="17" fill="#ddbea5"/><path d="M134 54l-16 52 37 3 2-49" fill="#74a78c"/><path d="M126 68 101 97m50-22 22 29" stroke="#629178" stroke-width="12" stroke-linecap="round"/><path d="m123 108-21 39m48-39 27 39" stroke="#456d76" stroke-width="13" stroke-linecap="round"/><path d="M104 147H88m89 0h17" stroke="#456d76" stroke-width="6" stroke-linecap="round"/>`}
    else if(id==='tilt'){shapes=`${common}<circle cx="76" cy="87" r="15" fill="#d9b798"/><path d="M92 93c30-6 55 7 76 11 14 3 24-4 37-20" stroke="#6b9a7d" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M166 105l-22 20m60-41 27 41" stroke="#587c67" stroke-width="13" stroke-linecap="round"/><path d="M140 69q11-9 23 0m-5-8 5 8-9 3" stroke="#4b8f73" stroke-width="2" fill="none"/>`}
    else if(id==='sit'){shapes=`${common}<path d="M160 93v55m-11-56h56" stroke="#9fae95" stroke-width="8" stroke-linecap="round"/><circle cx="112" cy="36" r="16" fill="#dfbda2"/><path d="M108 57l-15 42 51 7" stroke="#689b7a" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M142 104l3 43m-49-43-17 43" stroke="#58717b" stroke-width="12" stroke-linecap="round"/><path d="M93 72 79 102" stroke="#689b7a" stroke-width="11" stroke-linecap="round"/>`}
    else if(id==='heels'){shapes=`${common}<circle cx="138" cy="30" r="16" fill="#dfbda2"/><path d="M133 50v51m-4-34-25 21m41-20 23 20" stroke="#79a789" stroke-width="15" stroke-linecap="round"/><path d="M133 100 111 146l-13-7m35-39 28 44 16-6" stroke="#51787d" stroke-width="12" stroke-linecap="round"/><path d="M95 132v-24h-19v44m82-20v-24h18v44" stroke="#a5b8a4" stroke-width="4" fill="none"/>`}
    else if(id==='bridge'){shapes=`${common}<circle cx="73" cy="89" r="15" fill="#dfbda2"/><path d="M89 93 135 80 178 108" stroke="#6f9f84" stroke-width="16" fill="none" stroke-linecap="round"/><path d="m178 108 28 36M135 80l-9 41" stroke="#607d85" stroke-width="14" stroke-linecap="round"/><path d="M127 119h-18m97 25h17" stroke="#607d85" stroke-width="6" stroke-linecap="round"/><path d="M135 51v18m-7-8 7 8 7-8" stroke="#4e997a" stroke-width="2" fill="none"/>`}
    else if(id==='band'){shapes=`<circle cx="145" cy="29" r="16" fill="#dcbaa1"/><path d="M142 47v57m-29-46-11 29m49-29 12 29" stroke="#76a68a" stroke-width="15" stroke-linecap="round"/><path d="m143 103-28 45m28-45 27 45" stroke="#516f79" stroke-width="12" stroke-linecap="round"/><path d="M99 82q40-40 79 0" stroke="#d8a478" stroke-width="3" stroke-dasharray="5 3" fill="none"/><path d="m99 81-16 6m16-6-5-15m84 15 15 6m-15-6 5-15" stroke="#c68b6e" stroke-width="3" fill="none"/>`}
    return `<svg viewBox="0 0 280 165" role="img" aria-label="Ilustración esquemática de ${esc(exercises.find(x=>x.id===id)?.name||'ejercicio')}">${shapes}</svg>`;
  }
  function sidebar(){return `<aside class="sidebar"><div class="logo-wrap"><div class="logo">volver a <span>ti.</span></div><div class="brand-tag">Recuperación posparto</div></div><nav class="nav" aria-label="Navegación principal">${Object.entries(labels).map(([key,value])=>`<button class="nav-btn ${state.page===key?'active':''}" data-page="${key}">${svgIcon(key)} ${value}</button>`).join('')}</nav><div class="side-note"><strong>A tu ritmo, siempre.</strong> No hay días perdidos. Escucha tu cuerpo; una pausa también es avanzar.</div><div class="side-bottom">Hecho con cuidado. Tus datos no salen de este dispositivo.</div></aside>`;}
  function bottomnav(){return `<nav class="bottomnav" aria-label="Navegación móvil">${Object.entries(labels).map(([key,value])=>`<button class="${state.page===key?'active':''}" data-page="${key}" ${state.page===key?'aria-current="page"':''}>${svgIcon(key)}<span>${value}</span></button>`).join('')}</nav>`;}
  function header(){return `<div class="topbar"><div class="eyebrow">UN ESPACIO PARA RECUPERARTE</div><div class="date-widget">${svgIcon('calendar')} <span>${esc(currentDisplayDate())}</span></div></div>`;}
  function today(){const w=currentWeek(),d=diffDay(),list=tasks(w),done=checkedToday(),total=list.length,finished=list.filter(x=>done.includes(x.id)).length;
    return `<section class="hero"><div class="hero-content"><div class="pill"><i class="dot"></i> DÍA ${d} · SEMANA ${w}</div><h1>Un día<br>a la vez.</h1><p>${w===1?'Ahora toca sanar, descansar y moverse con mucha suavidad. Nada que demostrar.':esc(weeks[w-1].focus)}</p></div><div class="hero-art">${heroArt()}</div></section>
    <div class="mini-grid"><div class="card stat"><div class="value">${d}</div><div class="label">Días desde el parto</div></div><div class="card stat"><div class="value">${w}<span style="font-size:16px;color:#9aa99f">/12</span></div><div class="label">Semana del plan</div></div><div class="card stat"><div class="value">${finished}<span style="font-size:16px;color:#9aa99f">/${total}</span></div><div class="label">Actividades marcadas hoy</div></div></div>
    <div class="section-title"><h2>Hoy, a tu manera</h2><span>Opcional · sin objetivos obligatorios</span></div>
    <div class="card"><div class="card-hdr"><div><h3>Tu pequeña rutina</h3><p>Marca lo que te haya sentado bien. Puedes dejarlo todo sin marcar.</p></div><div class="progress-ring" style="--p:${Math.round(finished/total*100)}"><span>${Math.round(finished/total*100)}%</span></div></div><div class="checklist">${list.map(t=>`<div class="check-row ${done.includes(t.id)?'done':''}"><button data-task="${t.id}" aria-pressed="${done.includes(t.id)}" aria-label="${done.includes(t.id)?'Desmarcar':'Marcar'} ${esc(t.title)}"><span class="check-box">${done.includes(t.id)?svgIcon('check'):''}</span><span class="check-text"><span class="check-title">${esc(t.title)}</span><span class="check-detail" style="display:block">${esc(t.detail)}</span></span></button></div>`).join('')}</div></div>
    <div style="height:16px"></div><div class="notice">${svgIcon('info')}<div><strong>La recuperación no es una carrera.</strong> Si aumenta el sangrado, aparece dolor, pérdida de orina o sensación de peso vaginal, para y consulta con un profesional. <button data-page="care" style="border:0;padding:0;background:none;color:var(--teal-dark);text-decoration:underline;font-weight:700">Ver señales de alerta</button>.</div></div>
    <div class="section-title"><h2>Esta semana</h2><span>Semana ${w} de 12</span></div><div class="card week-card"><div class="tag">SEMANA ${w}</div><h3>${esc(weeks[w-1].name)}</h3><p class="lead" style="font-size:14px">${esc(weeks[w-1].focus)}</p><div class="week-list"><div class="week-action"><strong>Paseos</strong><span>${esc(weeks[w-1].walk)}</span></div><div class="week-action"><strong>Ejercicios</strong><span>${esc(weeks[w-1].exercise)}</span></div></div><div style="margin-top:18px"><button class="ghost-btn" data-page="plan">Ver el plan completo ${svgIcon('arrow')}</button></div></div>`;
  }
  function plan(){const w=state.selectedWeek||currentWeek(),p=weeks[w-1];return `<div class="eyebrow">TU HOJA DE RUTA</div><h1 style="margin-top:12px">Doce semanas.<br>Tu propio ritmo.</h1><p class="lead">Una guía de progresión, no un calendario que tengas que cumplir. Selecciona una semana para ver los detalles.</p><div class="section-title"><h2>Explora las semanas</h2><span>${w===currentWeek()?'Estás aquí':'Vista previa'}</span></div><div class="week-strip">${weeks.map((x,i)=>`<button class="week-chip ${w===i+1?'selected':''} ${currentWeek()===i+1?'current':''}" data-week="${i+1}" aria-pressed="${w===i+1}"><strong>${i+1}</strong><span>${currentWeek()===i+1?'Actual':'Semana'}</span></button>`).join('')}</div>
    <div class="card week-card" style="margin-top:11px"><span class="tag ${w>6?'peach':''}">${w<=2?'FASE 1 · RECONEXIÓN':w<=6?'FASE 2 · MOVILIDAD':'FASE 3 · FUERZA SUAVE'}</span><h2>Semana ${w}: ${esc(p.name)}</h2><p class="sub">${esc(p.focus)}</p><div class="week-list"><div class="week-action"><strong>01 · Caminatas</strong><span>${esc(p.walk)}</span></div><div class="week-action"><strong>02 · Movimiento</strong><span>${esc(p.exercise)}</span></div></div><hr class="divider"><strong style="font-size:13px">Para tener presente</strong><p style="font-size:13px;color:#7c8a80;line-height:1.6;margin:8px 0 17px">${esc(p.key)}</p><div class="actions"><button class="btn" data-page="library">Ver ejercicios ${svgIcon('arrow')}</button>${w!==currentWeek()?`<button class="btn secondary" data-week="${currentWeek()}">Ir a mi semana</button>`:''}</div></div>
    <div style="height:18px"></div><div class="notice">${svgIcon('info')}<span>El paso a ejercicios de fuerza con resistencia tras la semana 6 presupone una revisión posparto satisfactoria. La vuelta a correr o saltar requiere valoración individual, no solo haber alcanzado una fecha.</span></div>`;}
  function library(){const w=currentWeek(),subset=exercises.filter(x=>state.filter==='all'||x.week<=w);return `<div class="eyebrow">BIBLIOTECA DE MOVIMIENTO</div><h1 style="margin-top:12px">Movimientos<br>que te cuidan.</h1><p class="lead">Instrucciones sencillas para cada ejercicio. Las ilustraciones son esquemáticas y no sustituyen la valoración de una fisioterapeuta.</p><div class="filters"><button class="filter ${state.filter==='available'?'active':''}" data-filter="available">Para mi semana (${exercises.filter(x=>x.week<=w).length})</button><button class="filter ${state.filter==='all'?'active':''}" data-filter="all">Todos (${exercises.length})</button></div>
    <div class="exercise-grid">${subset.map(ex=>`<article class="card exercise-card"><div class="exercise-art ${ex.tint==='green'?'':ex.tint}">${art(ex.id)}</div><div class="exercise-body"><span class="tag ${ex.week>6?'peach':''}">Desde semana ${ex.week}</span><h3>${esc(ex.name)}</h3><p>${esc(ex.subtitle)}</p><div class="exercise-meta"><span>${esc(ex.dose)}</span><span>Sin dolor</span></div><button class="ghost-btn" data-exercise="${ex.id}">Ver cómo hacerlo ${svgIcon('arrow')}</button></div></article>`).join('')}</div>`;}
  function care(){return `<div class="eyebrow">EL CUIDADO PRIMERO</div><h1 style="margin-top:12px">Escucha las<br>señales de tu cuerpo.</h1><p class="lead">Tras un parto vaginal sin complicaciones puede empezarse con movimientos suaves, pero cada recuperación es diferente.</p><div class="row-2" style="margin-top:24px"><div class="card"><div class="card-hdr"><div><h3>Cuándo bajar el ritmo</h3><p>Detén la actividad y consulta con tu matrona o profesional sanitario.</p></div></div><div class="safety-list">${['El sangrado aumenta tras el ejercicio.','Dolor abdominal, perineal o pélvico.','Escapes de orina durante el movimiento.','Sensación de peso, presión o bulto vaginal.','Abdomen que sobresale en forma de cono al hacer fuerza.','Fatiga importante o mareo con actividades sencillas.'].map(t=>`<div class="safety-item"><span class="bul"></span><span>${t}</span></div>`).join('')}</div></div><div class="urgent"><span class="tag peach">ATENCIÓN URGENTE</span><h3 style="margin-top:14px">Señales que no debes ignorar</h3><ul><li>Empapar una compresa en una hora o expulsar coágulos muy grandes.</li><li>Fiebre de 38 °C o más.</li><li>Dolor de cabeza intenso o alteraciones visuales.</li><li>Dolor en el pecho o dificultad para respirar.</li><li>Dolor, enrojecimiento o hinchazón de una pierna.</li></ul><p style="color:#955d59;font-size:12px;line-height:1.6;margin-bottom:0">Busca asistencia médica urgente. En España, ante una emergencia, llama al 112.</p></div></div>
  <div class="section-title"><h2>Lo que más ayuda</h2></div><div class="card" style="padding:22px"><div class="week-list"><div><strong>Descanso y ayuda práctica</strong><p class="tiny">Dormir cuando sea posible y pedir ayuda con las tareas exigentes o las cargas.</p></div><div><strong>Comer e hidratarse</strong><p class="tiny">Comidas suficientes y agua, especialmente si está amamantando.</p></div><div><strong>Primeras seis semanas</strong><p class="tiny">Evitar esfuerzos intensos y, en lo posible, no cargar más peso que el bebé.</p></div><div><strong>Revisión posparto</strong><p class="tiny">Comentar los síntomas y la actividad física en la revisión habitual de las 6–8 semanas.</p></div></div></div>
  <div class="section-title"><h2>Tu configuración</h2></div><div class="card" style="padding:22px"><p style="font-size:13px;color:#748579">La fecha permite mostrar automáticamente la semana adecuada.</p><div class="field"><label for="birthdate">Fecha del parto</label><input id="birthdate" type="date" value="${esc(state.birthDate)}" max="${dayISO(now())}"></div><p class="tiny" style="margin-top:14px">Se guarda únicamente en este navegador. Si abre la web en otro móvil, tendrá otra checklist. No hay cuentas ni servidores.</p><div class="actions" style="margin-top:17px"><button class="btn secondary" data-export>Descargar progreso</button><button class="btn secondary" data-import>Importar progreso</button><button class="btn danger" data-reset>Borrar mis datos</button></div><input type="file" id="import-file" accept="application/json,.json" class="sr-only"></div>
  <div class="section-title"><h2>Fuentes clínicas</h2></div><div class="card" style="padding:18px 22px"><p class="source"><a href="https://www.acog.org/womens-health/faqs/exercise-after-pregnancy" target="_blank" rel="noopener noreferrer">ACOG · Exercise After Pregnancy</a></p><p class="source"><a href="https://www.nhs.uk/baby/support-and-services/keeping-fit-and-healthy-with-a-baby/" target="_blank" rel="noopener noreferrer">NHS · Keeping fit and healthy with a baby</a></p><p class="source"><a href="https://www.uclh.nhs.uk/patients-and-visitors/patient-information-pages/advice-and-exercise-following-childbirth" target="_blank" rel="noopener noreferrer">UCLH · Advice and exercise following childbirth</a></p><p class="source"><a href="https://www.nhs.uk/baby/support-and-services/your-post-pregnancy-body/" target="_blank" rel="noopener noreferrer">NHS · Your post-pregnancy body</a></p></div><p class="tiny" style="margin:18px 0 0">Guía informativa orientativa para recuperación tras parto vaginal sin puntos ni complicaciones. No sustituye las indicaciones médicas personalizadas. La progresión semanal es una propuesta flexible, no una prescripción clínica.</p>`;}
  function render(){const content={home:today,plan,library,care};const root=document.getElementById('app');root.innerHTML=sidebar()+`<main class="main">${header()}${content[state.page]()}</main>`+bottomnav()+ (state.modal?modal(): ''); bindEvents();}
  function modal(){const ex=exercises.find(e=>e.id===state.modal);if(!ex)return '';return `<div class="modal-cover" id="modal-cover"><div class="modal" role="dialog" aria-modal="true" aria-label="Cómo hacer ${esc(ex.name)}"><div class="modal-hdr"><div><span class="tag">Desde la semana ${ex.week}</span><h2 style="margin:11px 0 0">${esc(ex.name)}</h2></div><button class="close" data-close aria-label="Cerrar">×</button></div><div class="modal-content"><div class="modal-art">${art(ex.id)}</div><strong style="color:var(--teal-dark);font-size:13px">${esc(ex.dose)}</strong><ol>${ex.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="disclaimer"><strong>Importante:</strong> ${esc(ex.note)}</div><div class="actions" style="margin-top:18px"><button class="btn" data-close>Entendido</button></div></div></div></div>`;}
  function bindEvents(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{state.page=el.dataset.page;state.modal=null;render();window.scrollTo(0,0);}));document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.task,k=dayISO(now()),a=new Set(state.checked[k]||[]);a.has(id)?a.delete(id):a.add(id);state.checked[k]=[...a];save();render();}));document.querySelectorAll('[data-week]').forEach(el=>el.addEventListener('click',()=>{state.selectedWeek=Number(el.dataset.week);state.page='plan';render();}));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;render();}));document.querySelectorAll('[data-exercise]').forEach(el=>el.addEventListener('click',()=>{state.modal=el.dataset.exercise;render();document.querySelector('[data-close]')?.focus();}));document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>{state.modal=null;render();}));const cover=document.getElementById('modal-cover');if(cover)cover.addEventListener('click',e=>{if(e.target===cover){state.modal=null;render();}});const input=document.getElementById('birthdate');if(input)input.addEventListener('change',()=>{const v=input.value;if(!v||v>dayISO(now())){alert('Elige una fecha de parto válida.');input.value=state.birthDate;return;}state.birthDate=v;state.selectedWeek=null;save();render();});const exportBtn=document.querySelector('[data-export]');if(exportBtn)exportBtn.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({birthDate:state.birthDate,checked:state.checked},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mi-recuperacion-posparto.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);});const importBtn=document.querySelector('[data-import]');if(importBtn)importBtn.addEventListener('click',()=>document.getElementById('import-file')?.click());const file=document.getElementById('import-file');if(file)file.addEventListener('change',async()=>{if(!file.files?.length)return;try{const obj=JSON.parse(await file.files[0].text());if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.birthDate||'')||obj.birthDate>dayISO(now())||!obj.checked||typeof obj.checked!=='object'||Array.isArray(obj.checked)||!Object.values(obj.checked).every(v=>Array.isArray(v)&&v.every(x=>typeof x==='string'&&x.length<50)))throw Error('Formato incorrecto');if(!confirm('¿Importar esta copia? Reemplazará el progreso guardado en este navegador.'))return;state.birthDate=obj.birthDate;state.checked=obj.checked;save();render();}catch{alert('No se pudo importar el archivo. Comprueba que sea una copia válida.');}});const resetBtn=document.querySelector('[data-reset]');if(resetBtn)resetBtn.addEventListener('click',()=>{if(confirm('¿Borrar la fecha del parto y toda la checklist guardada en este navegador?')){localStorage.removeItem(STORAGE);state.birthDate=startingDate();state.checked={};state.selectedWeek=null;save();render();}});}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}});
  // Refresh the "today" checklist when returning after midnight, without changing saved data.
  let seenDate=dayISO(now());document.addEventListener('visibilitychange',()=>{if(!document.hidden&&seenDate!==dayISO(now())){seenDate=dayISO(now());render();}});
  save();render();
})();
</script>
